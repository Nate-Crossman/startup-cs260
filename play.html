<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIEWOW</title>
    <link rel="icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <div class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between align-items-center">
        <h1 class="mb-0">T.I.E.W.O.W.</h1>

        <nav class="navbar navbar-expand p-0 w-100 flex-md-grow-1 justify-content-center justify-content-md-end">
          <ul class="navbar-nav flex-row flex-wrap justify-content-center justify-content-md-end gap-2 w-100">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
            <li class="nav-item"><a class="nav-link" href="games.html">Join Game</a></li>
            <li class="nav-item"><a class="nav-link" href="how-to-play.html">Rules</a></li>
          </ul>
        </nav>
      </div>

      <hr />
    </header>

    <main>
      <div class="game mb-3">
        You are in game: <span class="game-name">[Name of Game]</span>
      </div>
      <section class="mb-5" aria-labelledby="players-heading">
        <h2 id="players-heading" class="h5 mb-2">Players</h2>
        <ul class="list-group players">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div class="ms-2 me-auto">
              <span class="player-score badge text-bg-secondary rounded-pill me-2">[1]</span>
              <span class="player-name">Player-Name</span>
            </div>
            <span class="player-role badge text-bg-primary rounded-pill">JUDGE</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div class="ms-2 me-auto">
              <span class="player-score badge text-bg-secondary rounded-pill me-2">[2]</span>
              <span class="player-name">Player-Name</span>
            </div>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div class="ms-2 me-auto">
              <span class="player-score badge text-bg-secondary rounded-pill me-2">[0]</span>
              <span class="player-name">Player-Name</span>
            </div>
          </li>
        </ul>
      </section>

      <section class="mb-5" aria-label="Enter Prompt">
        <form method="get" class="row g-3 align-items-end">
          <div class="col-12 col-md-6">
            <label for="prompt-input" class="form-label">Enter Prompt:</label>
            <input id="prompt-input" type="text" class="form-control" placeholder="Type a prompt here!" />
          </div>
          <div class="col-12 col-md-6">
            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="vote-heading">
        <h2 id="vote-heading" class="h5 mb-2">VOTE FOR THE VICTOR</h2>
        <div class="btn-group-vertical w-100" role="group" aria-label="Vote for the victor">
          <button type="button" class="btn btn-outline-primary">[User submission responding to the prompt]</button>
          <button type="button" class="btn btn-outline-primary">[Different and slightly lamer response]</button>
        </div>
      </section>

      
    </main>

    <footer>
      <hr />
      <div class="footer-content">
        <span class="text-reset">T.I.E.W.O.W. is a game by Nate Crossman</span>
        <a href="https://github.com/Nate-Crossman/startup-cs260">GitHub</a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
