<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIEWOW</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <h1>T.I.E.W.O.W.</h1>

      <nav>
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="games.html">Join Game</a></li>
          <li><a href="how-to-play.html">Rules of the Game</a></li>
        </menu>
      </nav>

      <hr />
    </header>

    <main>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Number of Players</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>
              <span class="game-name"> John Doe's Game</span>
            </td>
            <td>
              <span class="game-player-count">1/8</span>
            </td>
            <td>
              <form action="play.html">
                <button type="submit">JOIN</button>
              </form>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>
              <span class="game-name"> Example Game </span>
            </td>
            <td>
              <span class="game-player-count">4/8</span>
            </td>
            <td>
              <form action="play.html">
                <button type="submit">JOIN</button>
              </form>
            </td>
          </tr>
          <tr>
            <td>3</td>
            <td>
              <span class="game-name"> Empty Game</span>
            </td>
            <td>
              <span class="game-player-count">0/8</span>
            </td>
            <td>
              <form action="play.html">
                <button type="submit">JOIN</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </main>

    <footer>
      <hr />
      <span class="text-reset">T.I.E.W.O.W. is a game by Nate Crossman</span>
      <br />
      <a href="https://github.com/Nate-Crossman/startup-cs260">GitHub</a>
    </footer>

</html>
