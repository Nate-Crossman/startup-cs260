<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIEWOW</title>
    <link rel="icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between align-items-center">
        <h1 class="mb-0">T.I.E.W.O.W.</h1>

        <nav class="navbar navbar-expand p-0 w-100 flex-md-grow-1 justify-content-center justify-content-md-end">
          <ul class="navbar-nav flex-row flex-wrap justify-content-center justify-content-md-end gap-2 w-100">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
            <li class="nav-item"><a class="nav-link" href="games.html">Join Game</a></li>
            <li class="nav-item"><a class="nav-link" href="how-to-play.html">Rules</a></li>
          </ul>
        </nav>
      </div>

      <hr />
    </header>

    <main>
      <section aria-label="Available games">
        <table class="table table-sm table-striped align-middle game-list-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Number of Players</th>
              <th scope="col">Join</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td><span class="game-name">John Doe's Game</span></td>
              <td><span class="game-player-count">1/8</span></td>
              <td><form action="play.html"><button type="submit" class="btn btn-sm btn-primary w-100">Join</button></form></td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td><span class="game-name">Example Game</span></td>
              <td><span class="game-player-count">4/8</span></td>
              <td><form action="play.html"><button type="submit" class="btn btn-sm btn-primary w-100">Join</button></form></td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td><span class="game-name">Empty Game</span></td>
              <td><span class="game-player-count">0/8</span></td>
              <td><form action="play.html"><button type="submit" class="btn btn-sm btn-primary w-100">Join</button></form></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>
      <hr />
      <span class="text-reset">T.I.E.W.O.W. is a game by Nate Crossman</span>
      <br />
      <a href="https://github.com/Nate-Crossman/startup-cs260">GitHub</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
