<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon HTML</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>T.I.E.W.O.W.</h1>

      <h2>Welcome to The Intense Epic War of Words, the party game where only the strongest words survive...</h2>


      
      <!-- Navigation elements -->
      <nav>
        <div>Navigate to other parts of the page here!</div>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="scores.html">Scores</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <h1>Login</h1>
      <form method="get" action="play.html">
        <div>
          <span>Email: </span>
          <input type="text" placeholder="your@email.com" />
        </div>
        <div>
          <span>Password: </span>
          <input type="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Create New Account</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">T.I.E.W.O.W. is a game by Nate Crossman</span>
      <br />
      <a href="https://github.com/Nate-Crossman/startup-cs260">GitHub</a>
    </footer>
  </body>
</html>
